name: Fork checks

on:
  push:
    branches: [remove-entitlement-checks]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p swofty-core -p swofty-cli --all-targets -- -D warnings
      - name: Test
        run: cargo test -p swofty-core -p swofty-cli --no-fail-fast
