name: Fork checks

on:
  push:
    branches: [remove-entitlement-checks]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fork-workspace-debug
      - name: GPUI system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --no-fail-fast

  native:
    name: Native loader and event tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use every runner core
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/taskset" <<'EOF'
          #!/bin/sh
          [ "$1" = -c ] && shift 2
          exec "$@"
          EOF
          chmod +x "$RUNNER_TEMP/bin/taskset"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false
          use-tool-cache: true
      - uses: actions/cache@v6
        with:
          path: native/build/zig-cache
          key: fork-zig-${{ runner.os }}-0.16.0-${{ hashFiles('native/**', 'packages/sdk/include/**') }}
          restore-keys: fork-zig-${{ runner.os }}-0.16.0-
      - name: Build native loader
        run: native/build.sh
      - name: Native event tests
        run: native/test/run_events_test.sh
